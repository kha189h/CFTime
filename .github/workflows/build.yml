name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Giai nen du an
        run: |
          ls -la
          N=$(ls ./*.zip 2>/dev/null | wc -l)
          if [ "$N" -ne 1 ]; then echo "LOI: can dung 1 file .zip o thu muc goc, hien co $N file:"; ls ./*.zip; exit 1; fi
          unzip -q ./*.zip -d proj
          ls proj
      - name: Khoa ky ung dung
        env:
          KP: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KP" ]; then echo "LOI: chua co secret KEYSTORE_PASS (Settings > Secrets and variables > Actions)"; exit 1; fi
          KP=$(printf %s "$KP" | tr -d ' \r\n'); export KP
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in proj/app/release.keystore.enc -out proj/app/release.keystore -pass env:KP || { echo "LOI: KEYSTORE_PASS khong dung, hay nhap lai dung mat khau trong file KEYSTORE-PASS.txt"; exit 1; }
          keytool -list -keystore proj/app/release.keystore -storetype pkcs12 -storepass cftime2026 -alias cftime || { echo "LOI: khoa ky khong hop le"; exit 1; }
      - name: Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build
        working-directory: proj
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - name: Dat ten file
        run: cp proj/app/build/outputs/apk/release/app-release.apk CFTime.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CFTime v${{ github.run_number }}
          files: CFTime.apk
          make_latest: true
