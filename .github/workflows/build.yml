name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Giai nen du an
        run: unzip -q ./*.zip -d proj
      - name: Khoa ky ung dung
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KS" | base64 -d > proj/app/release.keystore
      - name: Android SDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build
        working-directory: proj
        run: gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}
      - name: Dat ten file
        run: cp proj/app/build/outputs/apk/release/app-release.apk CFTime.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: CFTime v${{ github.run_number }}
          files: CFTime.apk
          make_latest: true
